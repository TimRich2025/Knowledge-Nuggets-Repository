name: KN Source Hunt Test

on:
  workflow_dispatch:
    inputs:
      content_id:
        required: true
        type: string
      scene_brief:
        required: true
        type: string

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests==2.32.5 Pillow==11.3.0

      - name: Find and QC NASA motion clips
        run: |
          python - <<'PY'
          import json, os, subprocess
          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as f:
              event = json.load(f)
          env = os.environ.copy()
          env["KN_SCENE_BRIEF"] = event["inputs"]["scene_brief"]
          subprocess.run(["python", "source_hunter.py"], check=True, env=env)
          PY

      - name: Upload source manifest
        uses: actions/upload-artifact@v4
        with:
          name: source-manifest
          path: output/source_manifest.json
          retention-days: 1
