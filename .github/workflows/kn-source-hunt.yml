name: KN Source Hunt

on:
  workflow_dispatch:
    inputs:
      content_id:
        required: true
        type: string
      scene_brief:
        required: false
        default: ""
        description: "Optional short JSON. KN-ASTRONAUT-V4 uses the repository preset automatically."
        type: string
      callback_url:
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests==2.32.5 Pillow==11.3.0

      - name: Find, QC and select unique motion clips
        env:
          CONTENT_ID: ${{ inputs.content_id }}
          INPUT_SCENE_BRIEF: ${{ inputs.scene_brief }}
        run: |
          if [ "$CONTENT_ID" = "KN-ASTRONAUT-V4" ]; then
            export KN_SCENE_BRIEF="$(cat presets/astronaut_v4.json)"
          else
            export KN_SCENE_BRIEF="$INPUT_SCENE_BRIEF"
          fi
          python - <<'PY'
          import json, os
          data=json.loads(os.environ['KN_SCENE_BRIEF'])
          assert isinstance(data,list) and data, 'scene brief must be a non-empty JSON array'
          print(f'Loaded {len(data)} scenes successfully')
          PY
          python source_hunter.py

      - name: Upload source manifest for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kn-source-manifest-${{ inputs.content_id }}
          path: |
            output/source_manifest.json
            output/source_gate.json
          if-no-files-found: warn
          retention-days: 7

      - name: Callback to Make
        if: ${{ success() && inputs.callback_url != '' }}
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CONTENT_ID: ${{ inputs.content_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          manifest=json.load(open('output/source_manifest.json','r',encoding='utf-8'))
          gate=json.load(open('output/source_gate.json','r',encoding='utf-8'))
          selected=[x for x in manifest if x.get('status')=='SELECTED']
          payload={
              'content_id':os.environ['CONTENT_ID'],
              'status':'VISUALS_READY' if gate['ready'] else 'VISUALS_INCOMPLETE',
              'visual_manifest':manifest,
              'coverage_score':round(100*len(selected)/len(manifest)) if manifest else 0,
              'quality_score':round(sum(float(x.get('visual_quality_score') or 0) for x in selected)/len(selected)) if selected else 0,
              'rights_status':'PASS' if gate['ready'] else 'INCOMPLETE',
              'decision_reason':'Every scene has a distinct QC-passed video asset and the >=4 unique-source gate passed.' if gate['ready'] else 'Unique-source or scene-coverage gate failed.',
              'unique_sources':gate['unique_sources'],
              'minimum_unique_sources':gate['minimum_unique_sources']
          }
          req=urllib.request.Request(os.environ['CALLBACK_URL'],data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: print(r.status,r.read().decode('utf-8','replace'))
          PY
