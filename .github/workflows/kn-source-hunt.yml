name: KN Source Hunt

on:
  workflow_dispatch:
    inputs:
      content_id:
        required: true
        type: string
      scene_brief:
        required: false
        default: ""
        type: string
      callback_url:
        required: false
        default: ""
        type: string
  push:
    paths:
      - "triggers/kn-source-hunt.txt"
permissions:
  contents: read
env:
  CONTENT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.content_id || 'KN-ASTRONAUT-V4' }}
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr fonts-dejavu-core fonts-noto-core espeak-ng
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests==2.32.5 Pillow==11.3.0
      - name: Find and QC topic-matched motion clips
        id: source_hunt
        continue-on-error: true
        env:
          INPUT_SCENE_BRIEF: ${{ inputs.scene_brief }}
        run: |
          if [ "$CONTENT_ID" = "KN-ASTRONAUT-V4" ]; then export KN_SCENE_BRIEF="$(cat presets/astronaut_v4.json)"; else export KN_SCENE_BRIEF="$INPUT_SCENE_BRIEF"; fi
          python source_hunter.py
      - name: Reject duplicate source variants and find replacements
        if: steps.source_hunt.outcome == 'success'
        id: dedupe
        continue-on-error: true
        run: python source_dedupe.py
      - name: Build creative visual and sound direction
        if: always()
        run: python visual_director.py
      - name: Build locked Knowledge Nuggets layout plan
        if: always()
        run: python fullscreen_director.py
      - name: Verify source gate before render
        run: |
          python - <<'PY'
          import json
          g=json.load(open('output/source_gate.json'))
          print(json.dumps(g,indent=2))
          if not g.get('ready'): raise SystemExit('Source gate not ready; render blocked.')
          PY
      - name: Render locked-layout preview
        run: python renderer.py
      - name: Enforce layout lock QC
        run: python layout_qc.py
      - name: Upload production plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kn-production-plan-${{ env.CONTENT_ID }}
          path: |
            output/source_manifest.json
            output/source_gate.json
            output/visual_plan.json
            output/fullscreen_plan.json
            output/layout_qc.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload rendered preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kn-layout-v1-preview-${{ env.CONTENT_ID }}
          path: output/KN-ASTRONAUT-V4_LAYOUT_LOCKED_PREVIEW.mp4
          if-no-files-found: warn
          retention-days: 7
      - name: Callback to Make
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.callback_url != '' }}
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          gate=json.load(open('output/source_gate.json'))
          qc=json.load(open('output/layout_qc.json'))
          payload={'content_id':os.environ['CONTENT_ID'],'status':'LAYOUT_LOCKED_PREVIEW_RENDERED','unique_sources':gate['unique_sources'],'layout_qc':qc['pass']}
          req=urllib.request.Request(os.environ['CALLBACK_URL'],data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: print(r.status)
          PY
