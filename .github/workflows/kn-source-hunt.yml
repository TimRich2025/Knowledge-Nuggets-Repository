name: KN Source Hunt

on:
  workflow_dispatch:
    inputs:
      content_id:
        required: true
        type: string
      scene_brief:
        required: true
        type: string
      callback_url:
        required: false
        default: ""
        type: string
permissions:
  contents: read
env:
  CONTENT_ID: ${{ inputs.content_id }}
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          set -e
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y ffmpeg; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt * 8))
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          for attempt in 1 2 3; do
            pip install requests==2.32.5 Pillow==11.3.0 && break
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep $((attempt * 5))
          done
      - name: Static preflight
        run: |
          python -m py_compile vps/source_catalog.py source_review_queue.py
      - name: Discover official candidates and build contact sheets
        env:
          INPUT_SCENE_BRIEF: ${{ inputs.scene_brief }}
        run: |
          export KN_SCENE_BRIEF="$INPUT_SCENE_BRIEF"
          for attempt in 1 2; do
            python source_review_queue.py && break
            code=$?
            if [ "$attempt" = "2" ]; then exit "$code"; fi
            echo "Source discovery attempt $attempt failed; retrying after backoff..."
            sleep 8
          done
      - name: Upload visual review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kn-source-review-${{ env.CONTENT_ID }}
          path: |
            output/source_review_queue.json
            output/source-review/*.jpg
          if-no-files-found: warn
          retention-days: 7
      - name: Callback to Make
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.callback_url != '' }}
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          queue=json.load(open('output/source_review_queue.json'))
          payload={'content_id':os.environ['CONTENT_ID'],'status':'VISUAL_REVIEW_REQUIRED','render_allowed':False,'scenes':len(queue['scenes'])}
          req=urllib.request.Request(os.environ['CALLBACK_URL'],data=json.dumps(payload).encode(),headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: print(r.status)
          PY
