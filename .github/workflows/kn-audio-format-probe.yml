name: KN Audio Format Probe

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/probe_edge_quality.py
      - .github/workflows/kn-audio-format-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install edge-tts==7.2.8 mutagen==1.47.0
      - run: python .github/scripts/probe_edge_quality.py
      - uses: actions/upload-artifact@v4
        with:
          name: kn-audio-format-probe
          path: tts-format-probe/
          retention-days: 1
