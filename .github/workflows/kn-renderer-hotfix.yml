name: KN Renderer Hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply deterministic renderer hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("render.py")
          s = p.read_text(encoding="utf-8")

          # Shorter subtitle chunks: prevents edge clipping even on long words.
          s = s.replace(
              'gs=(i//4)*4; ge=min(gs+4,n); parts=[]',
              'gs=(i//3)*3; ge=min(gs+3,n); parts=[]'
          )

          pattern = re.compile(
              r'cmd=\["ffmpeg","-hide_banner","-loglevel","error","-y"\]\n'
              r'for path in vertical_clips:.*?'
              r'run\(cmd,timeout=180\)\n',
              re.S
          )
          replacement = '''concat_path=OUT/"concat.txt"
joined_path=OUT/"joined.mp4"
concat_path.write_text("".join(f"file '{p.resolve().as_posix()}'\\n" for p in vertical_clips),encoding="utf-8")
run(["ffmpeg","-hide_banner","-loglevel","error","-y","-f","concat","-safe","0","-i",str(concat_path),"-c","copy","-movflags","+faststart",str(joined_path)],timeout=60)
final_filter=f"[1:v]scale=48:-1:flags=lanczos,format=rgba[wm];[0:v][wm]overlay=W-w-52:H-h-78:eof_action=repeat:repeatlast=1[branded];[branded]ass={ASS_PATH.as_posix()}[finalv]"
run(["ffmpeg","-hide_banner","-loglevel","error","-y","-i",str(joined_path),"-i",str(WM_PATH),"-i",str(AUDIO_PATH),"-filter_complex",final_filter,"-map","[finalv]","-map","2:a:0","-t",f"{audio_duration:.3f}","-c:v","libx264","-preset","superfast","-crf","16","-pix_fmt","yuv420p","-profile:v","high","-level","4.2","-c:a","aac","-b:a","192k","-movflags","+faststart",str(VIDEO_OUT)],timeout=150)
'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f"Expected one final-render block, patched {n}")

          p.write_text(s2, encoding="utf-8")
          PY
          python -m py_compile render.py
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "Knowledge Nuggets Automation"
          git config user.email "actions@users.noreply.github.com"
          git add render.py
          git diff --cached --quiet && exit 0
          git commit -m "Harden final render concat and subtitle safety"
          git push origin main
