name: KN Render

on:
  workflow_dispatch:
    inputs:
      content_id:
        required: true
        type: string
      script:
        required: true
        type: string
      render_package:
        required: true
        type: string
      audio_url:
        required: true
        type: string
      watermark_url:
        required: false
        default: ""
        type: string
      callback_url:
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kn-whisper-base-en-v1

      - name: Install renderer dependencies
        run: pip install -r requirements.txt

      - name: Materialize renderer
        env:
          RENDERER_ZLIB_B64: ""
        run: |
          python - <<'PY'
          import base64, os, zlib
          raw = zlib.decompress(base64.b64decode(os.environ["RENDERER_ZLIB_B64"]))
          open("render.py","wb").write(raw)
          PY

      - name: Render Short
        env:
          KN_CONTENT_ID: ${{ inputs.content_id }}
          KN_SCRIPT: ${{ inputs.script }}
          KN_RENDER_PACKAGE: ${{ inputs.render_package }}
          KN_AUDIO_URL: ${{ inputs.audio_url }}
          KN_WATERMARK_URL: ${{ inputs.watermark_url }}
        run: python render.py

      - name: Publish temporary render release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_ID: ${{ inputs.content_id }}
        run: |
          SAFE_ID="$(printf '%s' "$CONTENT_ID" | tr -c 'A-Za-z0-9_-' '_')"
          TAG="kn-render-${SAFE_ID}-${GITHUB_RUN_ID}"
          VIDEO="output/${SAFE_ID}.mp4"
          gh release create "$TAG" "$VIDEO#${SAFE_ID}.mp4" --repo "$GITHUB_REPOSITORY" --title "Temporary render ${CONTENT_ID}" --notes "Automated Knowledge Nuggets render. Safe to delete after publishing."
          URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[0].url')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Callback to Make
        if: ${{ inputs.callback_url != '' }}
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          RENDER_URL: ${{ steps.release.outputs.url }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          qc=json.load(open("output/qc.json","r",encoding="utf-8"))
          payload={**qc,"render_url":os.environ["RENDER_URL"],"release_tag":os.environ["RELEASE_TAG"],"github_run_id":os.environ["GITHUB_RUN_ID"],"repository":os.environ["GITHUB_REPOSITORY"]}
          req=urllib.request.Request(os.environ["CALLBACK_URL"],data=json.dumps(payload).encode(),headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as r:
              print(r.status,r.read().decode("utf-8","replace"))
          PY
