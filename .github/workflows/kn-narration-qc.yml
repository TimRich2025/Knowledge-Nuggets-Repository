name: KN Narration QC

on:
  push:
    branches: [main]
    paths:
      - vps/source_cache.py
      - vps/edge_word_tts.py
      - vps/test_tts_command.py
      - vps/production_contract.py
      - vps/test_shot_bounds.py
      - vps/test_source_diversity.py
      - vps/source_pool.py
      - vps/source_catalog.py
      - vps/test_source_variant.py
      - vps/test_continuous_narration.py
      - vps/soundtrack.py
      - vps/scene_match.py
      - vps/test_scene_match.py
      - vps/test_soundtrack.py
      - vps/test_source_pool.py
      - vps/local_renderer.py
      - vps/test_concat_tolerance.py
      - layout_lock.py
      - vps/test_caption_layout.py
      - vps/social_metadata.py
      - vps/test_social_metadata.py
      - vps/youtube_publisher.py
      - vps/test_youtube_publisher.py
      - vps/pipeline.py
      - vps/config.py
      - vps/api.py
      - .github/workflows/kn-narration-qc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KN_DATA_DIR: /tmp/kn-narration-qc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare speech runtime
        run: |
          sudo apt-get update -qq
          # The same font packages the worker image installs. Without them the
          # layout tests cannot open NotoSansDisplay and every one of them errors.
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core fonts-noto-extra
          command -v ffmpeg
          test -f /usr/share/fonts/truetype/noto/NotoSansDisplay-Black.ttf
          test -f /usr/share/fonts/truetype/noto/NotoSansDisplay-ExtraCondensedBlack.ttf
          test -f /usr/share/fonts/truetype/noto/NotoSansDisplay-Light.ttf
          python -m pip install -r vps/requirements.txt
      - name: Synthesize and verify all spoken words
        run: |
          python -m unittest vps.test_production_contract
          python -m unittest vps.test_tts_command
          python -m unittest vps.test_shot_bounds
          python -m unittest vps.test_source_diversity
          python -m unittest vps.test_source_pool
          python -m unittest vps.test_source_variant
          python -m unittest vps.test_continuous_narration
          python -m unittest vps.test_soundtrack
          python -m unittest vps.test_scene_match
          python -m unittest vps.test_concat_tolerance
          python -m unittest vps.test_caption_layout
          python -m unittest vps.test_social_metadata
          python -m unittest vps.test_youtube_publisher
          python -m vps.tts_qc
      - name: Save narration for preview review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kn-rocket-narration-qc
          path: tts-qc-output/
          retention-days: 1
