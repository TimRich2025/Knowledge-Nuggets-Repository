name: KN Uncompressed Voice QC

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/kn_open_voice.py
      - .github/workflows/kn-open-voice-qc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install kokoro-onnx==0.6.1 soundfile==0.13.1 numpy
      - run: python .github/scripts/kn_open_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: kn-open-voice-wav
          path: kn-open-voice/
          retention-days: 1
